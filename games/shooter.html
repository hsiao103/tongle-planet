<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>同樂小將・節慶彈幕戰</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f1c; overflow: hidden; touch-action: none; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  #game { width: 100vw; height: 100vh; }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; height: 150px; display: none; justify-content: space-between; align-items: center; padding: 0 22px calc(6px + env(safe-area-inset-bottom)); pointer-events: none; box-sizing: border-box; background: #0b0f1c; }
  #pad, #pad * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }

  /* 左側：虛擬搖桿 */
  #joy { position: relative; width: 120px; height: 120px; box-sizing: border-box; border-radius: 50%; border: 4px solid #777a7f;
         background: radial-gradient(circle at 50% 45%, #3b3e43 0%, #1b1c1f 70%, #0d0d0f 100%);
         pointer-events: auto; opacity: .95; }
  #joy svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #joy .tri { position: absolute; width: 0; height: 0; border-style: solid; pointer-events: none; }
  #joy .up    { left: 50%; top: 8px;  transform: translateX(-50%); border-width: 0 6px 10px 6px; border-color: transparent transparent #fff transparent; }
  #joy .down  { left: 50%; bottom: 8px; transform: translateX(-50%); border-width: 10px 6px 0 6px; border-color: #fff transparent transparent transparent; }
  #joy .left  { top: 50%; left: 8px;  transform: translateY(-50%); border-width: 6px 10px 6px 0; border-color: transparent #fff transparent transparent; }
  #joy .right { top: 50%; right: 8px; transform: translateY(-50%); border-width: 6px 0 6px 10px; border-color: transparent transparent transparent #fff; }
  #joy .up.on    { border-bottom-color: #2e9bdc; }
  #joy .down.on  { border-top-color: #2e9bdc; }
  #joy .left.on  { border-right-color: #2e9bdc; }
  #joy .right.on { border-left-color: #2e9bdc; }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; box-sizing: border-box;
          border: 2px solid #6c6e72; background: radial-gradient(circle at 45% 40%, #5d6066, #1b1c1f 75%); pointer-events: none; }

  /* 右側：大招鈕 */
  #pad .acts { position: relative; width: 120px; height: 120px; pointer-events: auto; }
  #pad .acts button { position: absolute; right: 0; bottom: 6px; width: 92px; height: 92px; border-radius: 50%; border: 3px solid rgba(255,255,255,.6); background: rgba(255,120,60,.35); color: #fff; font-size: 22px; font-weight: bold; }
  #pad .acts button:active { background: rgba(255,120,60,.7); }

  @media (pointer: coarse) { #pad { display: flex; } #game { height: calc(100vh - 150px); } }

  #home { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 20; padding: 3px 12px; border-radius: 999px;
          background: rgba(0,0,0,.45); color: rgba(255,255,255,.8); font-size: 13px; text-decoration: none; border: 1px solid rgba(255,255,255,.25);
          -webkit-tap-highlight-color: transparent; }
  #home:hover, #home:active { background: rgba(0,0,0,.7); color: #fff; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
<a id="home" href="index.html" title="回到遊戲選單">⌂ 遊戲選單</a>
<script>
/* 小行星整合：?from=planet 表示從同樂小行星傳送門進來；embed=1 表示放在小行星的視窗裡 */
var PLANET = (function () {
  var q; try { q = new URLSearchParams(location.search); } catch (e) { q = { get: function () { return null; } }; }
  return { on: q.get('from') === 'planet', embed: q.get('embed') === '1' };
})();
function planetPost(type, data) {
  try {
    if (window.parent && window.parent !== window) {
      var m = { source: 'tongle-games', type: type }; for (var k in (data || {})) m[k] = data[k];
      window.parent.postMessage(m, /^https?:/.test(location.protocol) ? location.origin : '*');
    }
  } catch (e) {}
}
(function () {
  var a = document.getElementById('home'); if (!a || !PLANET.on) return;
  a.textContent = '🪐 回小行星'; a.title = '回到同樂小行星';
  a.href = '../index.html';
  if (PLANET.embed) a.style.display = 'none';   // 外層小行星視窗已有「回小行星」按鈕
  a.addEventListener('click', function (ev) { if (PLANET.embed) { ev.preventDefault(); planetPost('tongle:close'); } });
  document.addEventListener('keydown', function (ev) { if (PLANET.embed && ev.key === 'Escape') planetPost('tongle:close'); });
})();
</script>
<div id="game"></div>
<div id="pad">
  <div id="joy">
    <svg viewBox="0 0 112 112" aria-hidden="true">
      <g stroke="#2e9bdc" stroke-width="3" stroke-linecap="round">
        <line x1="22" y1="22" x2="35" y2="35"/><line x1="90" y1="22" x2="77" y2="35"/>
        <line x1="22" y1="90" x2="35" y2="77"/><line x1="90" y1="90" x2="77" y2="77"/>
      </g>
    </svg>
    <i class="tri up"></i><i class="tri down"></i><i class="tri left"></i><i class="tri right"></i>
    <div id="knob"></div>
  </div>
  <div class="acts"><button data-k="act">大招</button></div>
</div>

<script>
(function () {
  const W = 540, H = 960;
  const OL = 0x1d2433;
  const FONT = '"Noto Sans TC","Microsoft JhengHei",sans-serif';

  // ───────── 小工具 ─────────
  function rng(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  const hexStr = function (n) { return '#' + ('000000' + n.toString(16)).slice(-6); };
  function loadBest() { try { return JSON.parse(localStorage.getItem('tongle_shooter_best') || '{}'); } catch (e) { return {}; } }
  function saveBest(b) { try { localStorage.setItem('tongle_shooter_best', JSON.stringify(b)); } catch (e) {} }
  function pad6(n) { return ('000000' + n).slice(-6); }

  // ───────── 輸入：按鈕與搖桿（雙軸類比）─────────
  const pad = { left: false, right: false, up: false, down: false, act: false, actEdge: false, ax: 0, ay: 0 };
  let btnPid = null;
  let joyReset = function () {};
  function releaseAll() { btnPid = null; pad.act = false; joyReset(); }
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', function () { if (document.hidden) releaseAll(); });
  window.addEventListener('pagehide', releaseAll);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  (function () {
    const b = document.querySelector('#pad .acts button');
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); btnPid = e.pointerId; pad.act = true; pad.actEdge = true; });
    const up = function (e) { if (btnPid === e.pointerId) { btnPid = null; pad.act = false; } };
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    const touchEnd = function (e) { if (e.touches && e.touches.length === 0) releaseAll(); };
    window.addEventListener('touchend', touchEnd);
    window.addEventListener('touchcancel', touchEnd);
  })();
  (function () {
    const joy = document.getElementById('joy');
    const knob = document.getElementById('knob');
    const tri = { up: joy.querySelector('.up'), down: joy.querySelector('.down'), left: joy.querySelector('.left'), right: joy.querySelector('.right') };
    const R = 34, DEAD = 8, ON = 10, OFF = 7;
    let pid = null;
    function paint() {
      tri.left.classList.toggle('on', pad.left); tri.right.classList.toggle('on', pad.right);
      tri.up.classList.toggle('on', pad.up); tri.down.classList.toggle('on', pad.down);
    }
    joyReset = function () {
      pid = null; knob.style.transform = 'translate(0px,0px)';
      pad.left = pad.right = pad.up = pad.down = false; pad.ax = 0; pad.ay = 0; paint();
    };
    function axis(v, wasOn) {
      const a = Math.abs(v);
      const on = a > (wasOn ? OFF : ON);
      if (!on) return { on: false, val: 0 };
      const t = Math.min(1, Math.max(0, (a - DEAD) / (R - DEAD)));
      return { on: true, val: Math.sign(v) * (0.4 + 0.6 * t) };
    }
    function move(e) {
      const rc = joy.getBoundingClientRect();
      let dx = e.clientX - (rc.left + rc.width / 2), dy = e.clientY - (rc.top + rc.height / 2);
      const len = Math.hypot(dx, dy);
      if (len > R) { dx = dx / len * R; dy = dy / len * R; }
      knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      const x = axis(dx, pad.left || pad.right), y = axis(dy, pad.up || pad.down);
      pad.ax = x.val; pad.ay = y.val;
      pad.left = x.on && dx < 0; pad.right = x.on && dx > 0;
      pad.up = y.on && dy < 0; pad.down = y.on && dy > 0;
      paint();
    }
    joy.addEventListener('pointerdown', function (e) {
      e.preventDefault(); pid = e.pointerId;
      try { joy.setPointerCapture(pid); } catch (err) {}
      move(e);
    });
    window.addEventListener('pointermove', function (e) { if (e.pointerId === pid) { e.preventDefault(); move(e); } }, { passive: false });
    const end = function (e) { if (e.pointerId === pid) joyReset(); };
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
    joy.addEventListener('lostpointercapture', end);
  })();

  // ───────── 人物繪製（頭像、主角）─────────
  const PAL = {
    kid:     { shirt: 0x3a86ff, hair: 0x5a3825, skin: 0xffd6a5 },
    guard:   { shirt: 0x2f7f86, hair: 0xb9bcc2, skin: 0xf3c9a0 },
    student: { shirt: 0xff8fab, hair: 0x3b2a20, skin: 0xffd6a5 },
    teacher: { shirt: 0x8338ec, hair: 0x2b2b2b, skin: 0xffd6a5 }
  };
  function drawHead(g, cx, cy, r, pal) {
    g.fillStyle(pal.skin, 1); g.fillCircle(cx, cy, r);
    g.fillStyle(pal.hair, 1);
    g.beginPath(); g.slice(cx, cy, r + 0.5, Math.PI, Math.PI * 2, false); g.fillPath();
    g.fillTriangle(cx - r * 0.9, cy, cx - r * 0.1, cy - r * 0.95, cx, cy + r * 0.15);
    g.fillTriangle(cx + r * 0.9, cy, cx + r * 0.3, cy - r * 0.95, cx + r * 0.1, cy);
    g.lineStyle(2, OL, 1); g.strokeCircle(cx, cy, r);
    g.fillStyle(OL, 1); g.fillCircle(cx - r * 0.38, cy + r * 0.2, r * 0.17); g.fillCircle(cx + r * 0.38, cy + r * 0.2, r * 0.17);
    g.fillStyle(0xffffff, 0.9); g.fillCircle(cx - r * 0.34, cy + r * 0.14, r * 0.06); g.fillCircle(cx + r * 0.42, cy + r * 0.14, r * 0.06);
    g.fillStyle(0xff9aa2, 0.65); g.fillCircle(cx - r * 0.68, cy + r * 0.52, r * 0.18); g.fillCircle(cx + r * 0.68, cy + r * 0.52, r * 0.18);
    g.lineStyle(1.5, OL, 1); g.beginPath(); g.arc(cx, cy + r * 0.5, r * 0.2, 0.15, Math.PI - 0.15); g.strokePath();
  }

  // 主角「同樂小將」：依節慶搭乘不同載具（64×78）
  function drawHero(g, th) {
    const P = PAL.kid;
    // 載具（畫在人物後面）
    if (th === 'halloween') {                       // 掃帚 + 披風
      g.fillStyle(0x6b3fa0, 1); g.fillTriangle(18, 42, 46, 42, 32, 66); g.lineStyle(2, OL, 1); g.strokeTriangle(18, 42, 46, 42, 32, 66);
      g.lineStyle(10, OL, 1); g.beginPath(); g.moveTo(6, 66); g.lineTo(46, 66); g.strokePath();
      g.lineStyle(6, 0xa87445, 1); g.beginPath(); g.moveTo(6, 66); g.lineTo(46, 66); g.strokePath();
      g.fillStyle(0xf2c14e, 1); g.fillPoints([{ x: 44, y: 58 }, { x: 62, y: 54 }, { x: 62, y: 76 }, { x: 44, y: 72 }], true);
      g.lineStyle(1.5, 0xc4922a, 1); for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(46, 60 + i * 4); g.lineTo(62, 57 + i * 5.5); g.strokePath(); }
      g.lineStyle(2, OL, 1); g.strokePoints([{ x: 44, y: 58 }, { x: 62, y: 54 }, { x: 62, y: 76 }, { x: 44, y: 72 }], true);
    } else if (th === 'teacher') {                  // 紙飛機
      g.fillStyle(0xffffff, 1); g.fillPoints([{ x: 32, y: 74 }, { x: 2, y: 46 }, { x: 32, y: 40 }], true);
      g.fillStyle(0xdfe9f5, 1); g.fillPoints([{ x: 32, y: 74 }, { x: 62, y: 46 }, { x: 32, y: 40 }], true);
      g.lineStyle(2, 0x8fa0b8, 1); g.strokePoints([{ x: 32, y: 74 }, { x: 2, y: 46 }, { x: 32, y: 40 }, { x: 62, y: 46 }], true);
      g.beginPath(); g.moveTo(32, 40); g.lineTo(32, 74); g.strokePath();
      g.lineStyle(2, 0xe03131, 1); g.beginPath(); g.moveTo(10, 50); g.lineTo(24, 50); g.moveTo(40, 50); g.lineTo(54, 50); g.strokePath();
    } else if (th === 'dragon') {                   // 龍舟
      g.fillStyle(0xd62828, 1); g.fillEllipse(32, 62, 60, 24);
      g.fillStyle(0xf2c14e, 1); g.fillRect(8, 56, 48, 5);
      g.lineStyle(2, OL, 1); g.strokeEllipse(32, 62, 60, 24);
      g.fillStyle(0x2f9e44, 1); g.fillTriangle(24, 52, 40, 52, 32, 40);   // 龍頭
      g.fillStyle(0xf2c14e, 1); g.fillTriangle(25, 46, 21, 38, 29, 44); g.fillTriangle(39, 46, 43, 38, 35, 44);
      g.lineStyle(2, OL, 1); g.strokeTriangle(24, 52, 40, 52, 32, 40);
      g.lineStyle(3, 0x8d6e63, 1); g.beginPath(); g.moveTo(8, 70); g.lineTo(2, 58); g.moveTo(56, 70); g.lineTo(62, 58); g.strokePath();
    } else {                                         // 春節：紅燈籠
      g.fillStyle(0xd62828, 1); g.fillEllipse(32, 64, 54, 26);
      g.lineStyle(1.5, 0x9c1a1a, 1); for (let i = -2; i <= 2; i++) { g.beginPath(); g.moveTo(32 + i * 8, 52); g.lineTo(32 + i * 11, 76); g.strokePath(); }
      g.fillStyle(0xf2c14e, 1); g.fillRect(20, 49, 24, 4); g.fillRect(20, 75, 24, 3);
      g.lineStyle(2, OL, 1); g.strokeEllipse(32, 64, 54, 26);
      g.lineStyle(2, 0xf2c14e, 1); g.beginPath(); g.moveTo(32, 78); g.lineTo(32, 78); g.strokePath();
    }
    // 身體與手
    g.fillStyle(P.shirt, 1); g.fillRoundedRect(22, 42, 20, 18, 6);
    g.lineStyle(2, OL, 1); g.strokeRoundedRect(22, 42, 20, 18, 6);
    g.fillStyle(0xffd166, 1); g.fillCircle(32, 50, 2.2);
    g.fillStyle(P.skin, 1); g.fillCircle(20, 58, 4); g.fillCircle(44, 58, 4);
    g.lineStyle(2, OL, 1); g.strokeCircle(20, 58, 4); g.strokeCircle(44, 58, 4);
    // 頭
    drawHead(g, 32, 28, 14, P);
    // 帽子
    if (th === 'halloween') {
      g.fillStyle(0x4b2a7a, 1); g.fillTriangle(20, 18, 44, 18, 34, -2 + 2); g.fillEllipse(32, 18, 34, 8);
      g.fillStyle(0xf2c14e, 1); g.fillRect(24, 14, 16, 4);
      g.lineStyle(2, OL, 1); g.strokeTriangle(21, 17, 43, 17, 34, 1); g.strokeEllipse(32, 18, 34, 8);
    } else if (th === 'teacher') {
      g.fillStyle(0x22262e, 1); g.fillRect(24, 11, 16, 6); g.fillPoints([{ x: 32, y: 4 }, { x: 52, y: 12 }, { x: 32, y: 20 }, { x: 12, y: 12 }], true);
      g.lineStyle(2, OL, 1); g.strokePoints([{ x: 32, y: 4 }, { x: 52, y: 12 }, { x: 32, y: 20 }, { x: 12, y: 12 }], true);
      g.lineStyle(2, 0xf2c14e, 1); g.beginPath(); g.moveTo(32, 12); g.lineTo(48, 18); g.lineTo(48, 26); g.strokePath();
    } else if (th === 'dragon') {
      g.fillStyle(0xd62828, 1); g.fillRect(18, 15, 28, 5);
      g.lineStyle(2, OL, 1); g.strokeRect(18, 15, 28, 5);
      g.fillStyle(0xf2c14e, 1); g.fillCircle(32, 17, 2.5);
    } else {
      g.fillStyle(0xb02a2a, 1); g.fillPoints([{ x: 19, y: 18 }, { x: 45, y: 18 }, { x: 41, y: 6 }, { x: 23, y: 6 }], true);
      g.lineStyle(2, OL, 1); g.strokePoints([{ x: 19, y: 18 }, { x: 45, y: 18 }, { x: 41, y: 6 }, { x: 23, y: 6 }], true);
      g.fillStyle(0xf2c14e, 1); g.fillCircle(32, 5, 3);
    }
  }

  // ───────── 敵人繪製 ─────────
  function eyesAngry(g, lx, rx, y, r) {
    g.fillStyle(0xffffff, 1); g.fillCircle(lx, y, r); g.fillCircle(rx, y, r);
    g.fillStyle(0x1b1b1b, 1); g.fillCircle(lx + 0.8, y + 0.8, r * 0.55); g.fillCircle(rx - 0.8, y + 0.8, r * 0.55);
    g.lineStyle(Math.max(2, r * 0.6), 0x1b1b1b, 1);
    g.beginPath(); g.moveTo(lx - r * 1.3, y - r * 1.7); g.lineTo(lx + r * 1.2, y - r * 0.9); g.strokePath();
    g.beginPath(); g.moveTo(rx + r * 1.3, y - r * 1.7); g.lineTo(rx - r * 1.2, y - r * 0.9); g.strokePath();
  }

  // ── 萬聖節 ──
  function artBat(g) {
    const c = 0x3a2352;
    g.fillStyle(c, 1);
    g.fillPoints([{ x: 20, y: 9 }, { x: 13, y: 4 }, { x: 2, y: 3 }, { x: 7, y: 12 }, { x: 3, y: 20 }, { x: 12, y: 17 }, { x: 16, y: 26 }, { x: 18, y: 20 }], true);
    g.fillPoints([{ x: 20, y: 9 }, { x: 27, y: 4 }, { x: 38, y: 3 }, { x: 33, y: 12 }, { x: 37, y: 20 }, { x: 28, y: 17 }, { x: 24, y: 26 }, { x: 22, y: 20 }], true);
    g.fillEllipse(20, 18, 14, 18);
    g.fillTriangle(14, 10, 18, 11, 14, 2); g.fillTriangle(26, 10, 22, 11, 26, 2);
    g.fillStyle(0xff4d4d, 1); g.fillCircle(16.5, 16, 2.1); g.fillCircle(23.5, 16, 2.1);
    g.fillStyle(0xffffff, 1); g.fillTriangle(17, 22, 19, 22, 18, 26); g.fillTriangle(21, 22, 23, 22, 22, 26);
  }
  function artGhost(g) {
    g.fillStyle(0xf4f1ff, 1); g.fillCircle(24, 24, 18);
    g.fillPoints([{ x: 6, y: 24 }, { x: 6, y: 46 }, { x: 12, y: 54 }, { x: 18, y: 46 }, { x: 24, y: 54 }, { x: 30, y: 46 }, { x: 36, y: 54 }, { x: 42, y: 46 }, { x: 42, y: 24 }], true);
    g.lineStyle(2, 0x7a5fb0, 1); g.beginPath(); g.arc(24, 24, 18, Math.PI, Math.PI * 2); g.strokePath();
    g.beginPath(); g.moveTo(6, 24); g.lineTo(6, 46); g.lineTo(12, 54); g.lineTo(18, 46); g.lineTo(24, 54); g.lineTo(30, 46); g.lineTo(36, 54); g.lineTo(42, 46); g.lineTo(42, 24); g.strokePath();
    g.fillStyle(0x1b1b1b, 1); g.fillEllipse(17, 27, 5, 8); g.fillEllipse(31, 27, 5, 8);
    g.fillEllipse(24, 38, 7, 9);
    g.fillStyle(0xffb48a, 0.8); g.fillCircle(11, 34, 3); g.fillCircle(37, 34, 3);
    g.fillStyle(0x4b2a7a, 1); g.fillTriangle(15, 11, 33, 11, 25, -1 + 1); g.fillEllipse(24, 11, 26, 6);
  }
  function drawPumpkin(g, k, ox, oy) {
    const X = function (v) { return ox + v * k; }, Y = function (v) { return oy + v * k; };
    const DK = 0x3b1606, lw = Math.max(2, 2 * k * 0.7);
    g.fillStyle(0xf26b0f, 1); g.fillEllipse(X(15), Y(32), 26 * k, 44 * k); g.fillEllipse(X(45), Y(32), 26 * k, 44 * k);
    g.fillStyle(0xff8a1f, 1); g.fillEllipse(X(23), Y(32), 26 * k, 46 * k); g.fillEllipse(X(37), Y(32), 26 * k, 46 * k);
    g.fillStyle(0xff9d33, 1); g.fillEllipse(X(30), Y(32), 24 * k, 47 * k);
    g.lineStyle(lw, DK, 0.5); g.strokeEllipse(X(23), Y(32), 26 * k, 46 * k); g.strokeEllipse(X(37), Y(32), 26 * k, 46 * k); g.strokeEllipse(X(30), Y(32), 24 * k, 47 * k);
    g.lineStyle(lw * 1.2, DK, 1); g.strokeEllipse(X(15), Y(32), 26 * k, 44 * k); g.strokeEllipse(X(45), Y(32), 26 * k, 44 * k);
    g.fillStyle(0x4c7a34, 1); g.fillRoundedRect(X(26), Y(3), 8 * k, 11 * k, 2 * k); g.lineStyle(lw, DK, 1); g.strokeRoundedRect(X(26), Y(3), 8 * k, 11 * k, 2 * k);
    g.fillStyle(0x6fae45, 1); g.fillEllipse(X(40), Y(9), 13 * k, 6 * k); g.strokeEllipse(X(40), Y(9), 13 * k, 6 * k);
    g.fillStyle(0x2b0f3a, 1);

      g.fillStyle(th.eb[0], 1); g.fillCircle(8, 8, 7.5); g.fillStyle(th.eb[1], 1); g.fillCircle(8, 8, 5); g.fillStyle(0xffffff, 1); g.fillCircle(8, 8, 2.4);
      g.generateTexture('eb_' + k, 16, 16); g.clear();
      g.fillStyle(th.eb[0], 1); g.fillCircle(12, 12, 11.5); g.fillStyle(th.eb[1], 1); g.fillCircle(12, 12, 8); g.fillStyle(0xffffff, 1); g.fillCircle(12, 12, 3.5);
      g.generateTexture('ebb_' + k, 24, 24); g.clear();
      // 背景飄浮物
      const fl = { halloween: [0xff8a1f, 0xb36bff], teacher: [0xffffff, 0xffd43b], dragon: [0x74c948, 0xffffff], newyear: [0xff6b6b, 0xffd43b] }[k];
      g.fillStyle(fl[0], 1); g.fillPoints([{ x: 5, y: 0 }, { x: 10, y: 6 }, { x: 5, y: 12 }, { x: 0, y: 6 }], true);
      g.generateTexture('fl0_' + k, 10, 12); g.clear();
      g.fillStyle(fl[1], 1); g.fillCircle(4, 4, 4); g.generateTexture('fl1_' + k, 8, 8); g.clear();
      g.destroy();
      s.made[k] = true;
    }

    T(x, y, str, size, color, extra) {

    // ───────── 標題畫面 ─────────

    // ───────── 開始遊戲 ─────────
    startGame(opts) {

      else s.showDialogue(PLANET.on ? [['旁白', '同樂小行星的夜空，傳送門忽然亮了起來。'], ['旁白', '訊號來自「' + th.name + '」的校園，那裡需要你！']].concat(th.intro) : th.intro, function () { s.beginStage(); });
    }

    buildHud() {

      s.hudBomb = s.T(W - 14, 31, '', 15, '#ffd8a8').setOrigin(1, 0).setDepth(51);
      s.bossBarBg = s.add.rectangle(W / 2, 66, 464, 12, 0x000000, 0.55).setDepth(50).setVisible(false).setStrokeStyle(2, 0xffffff, 0.8);
      s.bossBar = s.add.rectangle(W / 2 - 230, 66, 460, 8, 0xff4d4d).setOrigin(0, 0.5).setDepth(51).setVisible(false);

    // ───────── 關卡 ─────────
    setupStage(i) {
      const s = this, th = THEMES[s.themeKey];
      s.stage = i;
      s.clearList('bg');
      const sd = th.stages[i];
      const key = 'bg_' + s.themeKey + '_' + i;
      makeBg(s, key, sd.layout, sd.pal, s.themeKey);
      s.bg = s.add.tileSprite(0, 0, W, H, key).setOrigin(0).setDepth(0);
      s.ui.bg.push(s.bg);
      if (th.overlay) s.ui.bg.push(s.add.rectangle(0, 0, W, H, th.overlay[0], th.overlay[1]).setOrigin(0).setDepth(2));
      const R = rng(100 + i);
      for (let n = 0; n < 16; n++) {
        const f = s.add.image(R() * W, R() * H, (n % 2 ? 'fl0_' : 'fl1_') + s.themeKey).setDepth(3).setAlpha(0.55).setScale(0.8 + R() * 0.8);
        f.vy = 60 + R() * 90; f.ph = R() * 6; f.rotation = R() * 6;
        s.ui.bg.push(f);
        if (!s.floaters) s.floaters = [];
      }
      s.floaters = s.ui.bg.filter(function (o) { return o.vy; });
    }

    beginStage(bossNow) {
      const s = this, th = THEMES[s.themeKey];
      s.mode = 'play';
      s.waves = buildWaves(s.stage);
      s.waveIdx = 0; s.stageT = 0; s.boss = null; s.bossDeadT = 0; s.clearT = 0; s.bossSpawned = false;
      s.banner(th.stageIntro[s.stage][0], th.stageIntro[s.stage][1], th.stages[s.stage].name, 3600);
      if (bossNow) { s.waveIdx = s.waves.length; s.stageT = 99999; }
    }

    banner(title, sub) {
      const s = this;
      const a = s.T(W / 2, 250, title, 40, '#ffffff', { fontStyle: 'bold', stroke: '#101830', strokeThickness: 7 }).setOrigin(0.5).setDepth(60).setAlpha(0);
      const b = s.T(W / 2, 306, sub, 19, '#ffe8a3', { align: 'center', wordWrap: { width: 440 }, stroke: '#101830', strokeThickness: 4 }).setOrigin(0.5, 0).setDepth(60).setAlpha(0);
      s.tweens.add({ targets: [a, b], alpha: 1, duration: 350, yoyo: true, hold: 2400, onComplete: function () { a.destroy(); b.destroy(); } });
    }

    cleanupPlay() {
      const s = this;
      [s.pb, s.eb, s.en, s.it].forEach(function (arr) { if (arr) arr.forEach(function (o) { if (o.spr) o.spr.destroy(); }); });
      s.pb = []; s.eb = []; s.en = []; s.it = [];
      if (s.player) { s.tweens.killTweensOf(s.player); s.player.destroy(); s.player = null; }
      if (s.core) { s.core.destroy(); s.core = null; }
      if (s.flash) { s.flash.destroy(); s.flash = null; }
      s.boss = null;
    }

    // ───────── 對話 ─────────
    showDialogue(lines, onDone) {
      const s = this;
      s.mode = 'story';
      s.dlg = { lines: lines, i: -1, onDone: onDone, shown: 0, full: '', acc: 0 };
      const th = THEMES[s.themeKey];
      const U = s.ui.dlg;
      U.push(s.add.rectangle(W / 2, 792, 508, 218, 0x0d1226, 0.93).setDepth(70).setStrokeStyle(4, th.col));
      s.dPor = s.add.image(76, 782, 'por_hero').setDepth(71);
      s.dName = s.T(140, 700, '', 20, '#ffd166', { fontStyle: 'bold' }).setDepth(71);
      s.dText = s.T(140, 734, '', 20, '#ffffff', { wordWrap: { width: 368 }, lineSpacing: 6 }).setDepth(71);
      s.dMore = s.T(W - 40, 882, '▼', 20, '#aee3ff').setDepth(71);
      s.tweens.add({ targets: s.dMore, alpha: 0.2, yoyo: true, repeat: -1, duration: 500 });
      s.dSkip = s.T(W - 30, 690, '略過 ▶▶', 14, '#8fa0c8').setOrigin(1, 0).setDepth(72).setInteractive({ useHandCursor: true });
      s.dSkip.on('pointerdown', function (p, x, y, e) { if (e && e.stopPropagation) e.stopPropagation(); s.endDialogue(); });
      U.push(s.dPor, s.dName, s.dText, s.dMore, s.dSkip);
      s.advance();
    }
    advance() {
      const s = this, d = s.dlg;
      if (!d) return;
      if (d.shown < d.full.length) { d.shown = d.full.length; s.dText.setText(d.full); return; }
      d.i++;
      if (d.i >= d.lines.length) { s.endDialogue(); return; }
      const ln = d.lines[d.i];
      const map = { '警衛伯伯': 'por_guard', '草原班同學': 'por_student', '老師': 'por_teacher', '同樂小將': 'por_hero' };
      s.dName.setText(ln[0]);
      if (map[ln[0]]) { s.dPor.setTexture(map[ln[0]]).setVisible(true); s.dText.x = 140; s.dText.setWordWrapWidth(368); s.dName.x = 140; }
      else { s.dPor.setVisible(false); s.dText.x = 36; s.dText.setWordWrapWidth(470); s.dName.x = 36; }
      d.full = ln[1]; d.shown = 0; d.acc = 0; s.dText.setText('');
    }
    endDialogue() {
      const s = this, d = s.dlg;
      if (!d) return;
      s.dlg = null;
      s.clearList('dlg');
      if (d.onDone) d.onDone();
    }

    // ───────── 特效 ─────────
    boom(x, y, color, n, big) {
      const s = this;
      for (let i = 0; i < n; i++) {
        const sp = s.add.image(x, y, 'spark').setDepth(12).setTint(color).setScale(big ? 1.6 : 1);
        const a = Math.random() * Math.PI * 2, d = (big ? 60 : 26) + Math.random() * (big ? 90 : 34);
        s.tweens.add({ targets: sp, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, alpha: 0, scale: 0.2, duration: 380 + Math.random() * 220, onComplete: function () { sp.destroy(); } });
      }
    }
    floatText(x, y, str, color) {
      const s = this;
      const t = s.T(x, y, str, 18, color || '#ffffff', { fontStyle: 'bold', stroke: '#000000', strokeThickness: 4 }).setOrigin(0.5).setDepth(40);
      s.tweens.add({ targets: t, y: y - 36, alpha: 0, duration: 800, onComplete: function () { t.destroy(); } });
    }

    // ───────── 戰鬥 ─────────
    shoot() {
      const s = this;
      const k = s.themeKey, tx = 'pb_' + k, px = s.player.x, py = s.player.y - 30;
      const pat = s.power === 1 ? [[0, 0]] : s.power === 2 ? [[-9, 0], [9, 0]] : s.power === 3 ? [[0, 0], [-12, -0.16], [12, 0.16]] : [[0, 0], [-10, -0.12], [10, 0.12], [-18, -0.28], [18, 0.28]];
      pat.forEach(function (p) {
        const spr = s.add.image(px + p[0], py, tx).setDepth(7);
        spr.rotation = p[1];
        s.pb.push({ spr: spr, vx: Math.sin(p[1]) * 720, vy: -Math.cos(p[1]) * 720, dmg: 1 });
      });
    }

    ebullet(x, y, ang, speed, big) {
      const s = this;
      const spr = s.add.image(x, y, (big ? 'ebb_' : 'eb_') + s.themeKey).setDepth(11);
      s.eb.push({ spr: spr, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, r: big ? 9 : 5.5 });
    }
    aimAngle(x, y) { return Math.atan2(this.player.y - y, this.player.x - x); }

    spawn(def) {
      const s = this, th = THEMES[s.themeKey];
      const base = ENEMY_DEF[def.kind];
      const a = th.art[def.kind];
      const spr = s.add.image(def.x, -50, 'e_' + s.themeKey + '_' + def.kind).setDepth(5);
      const e = {
        spr: spr, kind: def.kind, mv: def.mv, x: def.x, y: -50, x0: def.x, t: 0, hp: base.hp, maxhp: base.hp, score: base.score,
        r: th.r[def.kind], spd: 150 + Math.random() * 30, state: 0, ty: 160 + Math.random() * 110, life: 6 + Math.random() * 2, f: 1 + Math.random() * 0.8, hitT: 0
      };
      if (def.mv === 'tank') e.spd = 55;
      s.en.push(e);
    }

    spawnBoss() {
      const s = this, th = THEMES[s.themeKey];
      const spr = s.add.image(W / 2, -120, 'e_' + s.themeKey + '_boss').setDepth(5);
      const hp = 380;
      s.boss = { spr: spr, kind: 'boss', mv: 'boss', x: W / 2, y: -120, t: 0, hp: hp, maxhp: hp, score: 20000, r: th.r.boss, state: 0, f1: 1, f2: 2, ang: 0, hitT: 0, phase: 0 };
      s.en.push(s.boss);
      s.bossBarBg.setVisible(true); s.bossBar.setVisible(true); s.bossName.setVisible(true).setText(th.bossName);
      s.bossSpawned = true;
      s.banner('WARNING！', th.bossName + ' 出現了！\n' + '「' + th.bossLine + '」');
      s.shake = 0.25;
    }

    dropItem(x, y, kind) {
      const s = this;
      const spr = s.add.image(x, y, 'it_' + kind).setDepth(6);
      s.it.push({ spr: spr, kind: kind, t: 0 });
    }
    roll(e) {
      const r = Math.random();
      if (e.kind === 'small') { if (r < 0.06) this.dropItem(e.x, e.y, 'p'); else if (r < 0.16) this.dropItem(e.x, e.y, 's'); }
      else if (e.kind === 'shooter') { if (r < 0.28) this.dropItem(e.x, e.y, 'p'); else if (r < 0.4) this.dropItem(e.x, e.y, 'b'); else if (r < 0.7) this.dropItem(e.x, e.y, 's'); }
      else if (e.kind === 'tank') {
        this.dropItem(e.x - 14, e.y, 'p');
        if (Math.random() < 0.5) this.dropItem(e.x + 14, e.y, 'b');
        if (Math.random() < 0.3) this.dropItem(e.x, e.y + 10, 'h');
      }
    }

    killEnemy(e) {
      const s = this, th = THEMES[s.themeKey];
      s.score += e.score;
      s.boom(e.x, e.y, th.col, e.kind === 'boss' ? 40 : 10, e.kind === 'boss');
      if (e.kind !== 'boss') { s.roll(e); s.floatText(e.x, e.y - 10, '+' + e.score, '#ffe8a3'); }
      e.spr.destroy();
      e.dead = true;
      s.en = s.en.filter(function (x) { return x !== e; });
    }

    damage(e, d) {
      const s = this;
      e.hp -= d;
      e.spr.setTint(0xff9999); e.hitT = 0.06;
      if (e.hp <= 0) {
        if (e.kind === 'boss') s.onBossDown(e);
        else s.killEnemy(e);
      }
    }

    onBossDown(e) {
      const s = this, th = THEMES[s.themeKey];
      s.score += e.score;
      s.eb.forEach(function (b) { b.spr.destroy(); }); s.eb = [];
      s.bossDeadT = 0.01; s.deadBoss = e; e.dead = true;
      s.en = s.en.filter(function (x) { return x !== e; });
      s.boss = null;
      s.bossBarBg.setVisible(false); s.bossBar.setVisible(false); s.bossName.setVisible(false);
      s.shake = 0.5;
    }

    hitPlayer() {
      const s = this;
      if (s.invT > 0 || s.god) return;
      s.lives--; s.power = Math.max(1, s.power - 1);
      s.invT = 2.2; s.shake = 0.3;
      s.boom(s.player.x, s.player.y, 0xff6b6b, 14, true);
      s.eb.forEach(function (b) { b.spr.destroy(); }); s.eb = [];
      if (s.lives <= 0) s.finish(false);
    }

    useBomb() {
      const s = this, th = THEMES[s.themeKey];
      if (s.bombs <= 0 || s.bombT > 0 || s.mode !== 'play') return;
      s.bombs--; s.bombT = 1; s.invT = Math.max(s.invT, 2.0);
      s.eb.forEach(function (b) { s.boom(b.spr.x, b.spr.y, th.col, 1); b.spr.destroy(); }); s.eb = [];
      s.en.slice().forEach(function (e) { if (e.kind === 'boss') s.damage(e, 25); else if (e.y > -20) s.damage(e, 14); });
      const ring = s.add.circle(s.player.x, s.player.y, 30, th.col, 0.0).setDepth(30).setStrokeStyle(10, th.col, 0.9);
      s.tweens.add({ targets: ring, scale: 22, alpha: 0, duration: 650, onComplete: function () { ring.destroy(); } });
      const fl = s.add.rectangle(0, 0, W, H, 0xffffff, 0.6).setOrigin(0).setDepth(35);
      s.tweens.add({ targets: fl, alpha: 0, duration: 380, onComplete: function () { fl.destroy(); } });
      const t = s.T(W / 2, 430, th.bombName + '！', 46, '#ffffff', { fontStyle: 'bold', stroke: '#' + ('000000' + th.col.toString(16)).slice(-6), strokeThickness: 9 }).setOrigin(0.5).setDepth(36);
      s.tweens.add({ targets: t, scale: 1.25, alpha: 0, duration: 900, onComplete: function () { t.destroy(); } });
      s.shake = 0.35;
    }

    // ───────── 結算 ─────────
    finish(win) {
      const s = this, th = THEMES[s.themeKey];
      if (s.mode === 'over' || s.mode === 'win') return;
      s.mode = win ? 'win' : 'over';
      s.endWait = 0.9;
      const prev = s.best[s.themeKey] || 0;
      const isBest = s.score > prev;
      if (isBest) { s.best[s.themeKey] = s.score; saveBest(s.best); }
      const U = s.ui.end;
      U.push(s.add.rectangle(0, 0, W, H, 0x000000, 0.72).setOrigin(0).setDepth(80));
      U.push(s.T(W / 2, 250, win ? '🎉 任務完成！' : '任務失敗', 52, win ? '#ffd166' : '#ff8787', { fontStyle: 'bold', stroke: '#101830', strokeThickness: 8 }).setOrigin(0.5).setDepth(81));
      U.push(s.T(W / 2, 340, win ? th.name + '守護成功，校園恢復平安！' : '再試一次，別氣餒！', 20, '#ffffff').setOrigin(0.5).setDepth(81));
      U.push(s.T(W / 2, 430, '分數  ' + s.score, 38, '#ffffff', { fontStyle: 'bold' }).setOrigin(0.5).setDepth(81));
      U.push(s.T(W / 2, 480, isBest ? '🏆 新紀錄！' : '最高分  ' + prev, 20, isBest ? '#ffd166' : '#aee3ff').setOrigin(0.5).setDepth(81));
      if (win) U.push(s.T(W / 2, 530, '評價  ' + '⭐'.repeat(Math.max(1, s.lives)), 26, '#ffffff').setOrigin(0.5).setDepth(81));
      const mk = function (y, label, col, fn) {
        const b = s.add.rectangle(W / 2, y, 300, 66, col).setDepth(81).setStrokeStyle(3, 0xffffff).setInteractive({ useHandCursor: true });
        const t = s.T(W / 2, y, label, 26, '#ffffff', { fontStyle: 'bold' }).setOrigin(0.5).setDepth(82);
        b.on('pointerdown', fn); U.push(b, t);
      };
      mk(640, '再玩一次', th.col, function () { s.startGame(); });
      mk(724, '換節慶 / 回主選單', 0x3a4770, function () { s.buildTitle(); });
      if (PLANET.on) mk(808, '🪐 回小行星', 0x2f7d5a, function () { if (PLANET.embed) planetPost('tongle:close'); else location.href = '../index.html'; });
      planetPost('tongle:result', { game: 'shooter', theme: s.themeKey, win: !!win, score: s.score, lives: s.lives });
      if (win) { /* 不再自動回主選單，讓玩家看結果 */ }
    }

    winSequence() {
      const s = this, th = THEMES[s.themeKey];
      s.showDialogue(th.ending, function () { s.finish(true); });
    }

    // ───────── 每幀 ─────────
    update(time, delta) {
      const s = this;
      const dt = Math.min(delta / 1000, 0.05);
      const J = Phaser.Input.Keyboard.JustDown, k = s.keys;
      const actPress = pad.actEdge; pad.actEdge = false;

      if (s.mode === 'title') {
        if (J(k.one)) s.selectTheme('halloween'); if (J(k.two)) s.selectTheme('teacher');
        if (J(k.three)) s.selectTheme('dragon'); if (J(k.four)) s.selectTheme('newyear');
        if (J(k.enter) || J(k.space) || actPress) s.startGame();
        return;
      }
      // 背景捲動、飄浮物（劇情與戰鬥都會動）
      if (s.bg) s.bg.tilePositionY -= 110 * dt;
      s.floaters.forEach(function (f) { f.y += f.vy * dt; f.x += Math.sin(time / 700 + f.ph) * 20 * dt; f.rotation += dt; if (f.y > H + 20) { f.y = -20; f.x = Math.random() * W; } });

      if (s.mode === 'story') {
        const d = s.dlg;
        if (d && d.shown < d.full.length) { d.acc += dt * 1000; while (d.acc >= 28 && d.shown < d.full.length) { d.acc -= 28; d.shown++; } s.dText.setText(d.full.slice(0, d.shown)); }
        if (J(k.space) || J(k.enter) || J(k.x) || actPress) s.advance();
        return;
      }
      if (s.mode === 'over' || s.mode === 'win') {
        s.endWait = Math.max(0, (s.endWait || 0) - dt);   // 剛結算時先等一下，避免連按空白鍵直接跳過結果
        if (s.endWait <= 0) {
          if (J(k.enter) || J(k.space)) s.startGame();
          if (J(k.m)) s.buildTitle();
        }
        return;
      }
      s.updatePlay(dt, time, actPress);
    }

    updatePlay(dt, time, actPress) {
      const s = this, th = THEMES[s.themeKey], k = s.keys, p = s.player;
      s.stageT += dt * 1000;
      s.invT = Math.max(0, s.invT - dt); s.bombT = Math.max(0, s.bombT - dt);

      // 玩家移動
      const kx = ((k.right.isDown || k.d.isDown) ? 1 : 0) - ((k.left.isDown || k.a.isDown) ? 1 : 0);
      const ky = ((k.down.isDown || k.s.isDown) ? 1 : 0) - ((k.up.isDown || k.w.isDown) ? 1 : 0);
      let ax, ay;
      if (kx !== 0 || ky !== 0) { const l = Math.hypot(kx, ky) || 1; ax = kx / l; ay = ky / l; } else { ax = pad.ax; ay = pad.ay; }
      p.x = Phaser.Math.Clamp(p.x + ax * 340 * dt, 30, W - 30);
      p.y = Phaser.Math.Clamp(p.y + ay * 340 * dt, 200, H - 60);
      s.core.setPosition(p.x, p.y + 4);
      p.setAlpha(s.invT > 0 ? (Math.floor(time / 90) % 2 ? 0.35 : 1) : 1);

      // 大招
      if (Phaser.Input.Keyboard.JustDown(k.space) || Phaser.Input.Keyboard.JustDown(k.x) || actPress) s.useBomb();

      // 死亡爆炸序列中不開火
      const dying = s.bossDeadT > 0;
      s.fireT -= dt;
      if (s.fireT <= 0 && !dying) { s.fireT = 0.12; s.shoot(); }

      // 生成敵人
      while (!dying && s.waveIdx < s.waves.length && s.waves[s.waveIdx].t <= s.stageT) { s.spawn(s.waves[s.waveIdx]); s.waveIdx++; }
      // Boss（第三關）
      if (s.stage === 2 && !s.bossSpawned && !dying && s.waveIdx >= s.waves.length && s.en.length === 0) s.spawnBoss();

      // 敵人
      s.en.slice().forEach(function (e) { if (!e.dead) s.updateEnemy(e, dt); });

      // 玩家子彈
      s.pb = s.pb.filter(function (b) {
        b.spr.x += b.vx * dt; b.spr.y += b.vy * dt;
        let alive = b.spr.y > -30 && b.spr.x > -30 && b.spr.x < W + 30;
        if (alive) {
          for (let i = 0; i < s.en.length; i++) {
            const e = s.en[i];
            if (e.y < -10 && e.kind !== 'boss') continue;
            const dx = b.spr.x - e.x, dy = b.spr.y - e.y;
            if (dx * dx + dy * dy < (e.r + 6) * (e.r + 6)) { s.damage(e, b.dmg); alive = false; break; }
          }
        }
        if (!alive) b.spr.destroy();
        return alive;
      });

      // 敵彈
      const pr = 6;
      s.eb = s.eb.filter(function (b) {
        b.spr.x += b.vx * dt; b.spr.y += b.vy * dt;
        let alive = b.spr.y < H + 30 && b.spr.y > -40 && b.spr.x > -40 && b.spr.x < W + 40;
        if (alive && s.invT <= 0) {
          const dx = b.spr.x - p.x, dy = b.spr.y - p.y;
          if (dx * dx + dy * dy < (b.r + pr) * (b.r + pr)) { s.hitPlayer(); alive = false; }
        }
        if (!alive && b.spr.active) b.spr.destroy();
        return alive;
      });
      // 與敵人碰撞
      if (s.invT <= 0) {
        for (let i = 0; i < s.en.length; i++) {
          const e = s.en[i];
          const dx = e.x - p.x, dy = e.y - p.y, rr = e.r * 0.8 + pr;
          if (dx * dx + dy * dy < rr * rr) { s.hitPlayer(); break; }
        }
      }

      // 道具
      s.it = s.it.filter(function (it) {
        it.t += dt;
        it.spr.y += (it.t < 0.35 ? -50 : 110) * dt;
        const dx = it.spr.x - p.x, dy = it.spr.y - p.y;
        if (dx * dx + dy * dy < 60 * 60) { it.spr.x -= dx * 5 * dt; it.spr.y -= dy * 5 * dt; }
        let alive = it.spr.y < H + 30;
        if (alive && dx * dx + dy * dy < 30 * 30) {
          alive = false;
          if (it.kind === 'p') { if (s.power < 4) { s.power++; s.floatText(p.x, p.y - 40, '火力 UP！', '#74c0fc'); } else { s.score += 500; s.floatText(p.x, p.y - 40, '+500', '#ffe8a3'); } }
          else if (it.kind === 'b') { s.bombs = Math.min(5, s.bombs + 1); s.floatText(p.x, p.y - 40, '大招 +1', '#ffd8a8'); }
          else if (it.kind === 's') { s.score += 500; s.floatText(p.x, p.y - 40, '+500', '#ffe8a3'); }
          else if (it.kind === 'h') { s.lives = Math.min(5, s.lives + 1); s.floatText(p.x, p.y - 40, '生命 +1', '#ff8787'); }
        }
        if (!alive) it.spr.destroy();
        return alive;
      });

      // Boss 死亡演出
      if (s.bossDeadT > 0) {
        s.bossDeadT += dt;
        const e = s.deadBoss;
        if (e && e.spr.active) {
          if (Math.random() < 0.5) s.boom(e.x + (Math.random() - 0.5) * 140, e.y + (Math.random() - 0.5) * 120, th.col, 6, true);
          e.spr.alpha = Math.max(0, 1 - s.bossDeadT / 2.2); e.spr.x = e.x + Math.sin(time / 30) * 4;
        }
        if (s.bossDeadT > 2.2) { if (e && e.spr.active) e.spr.destroy(); s.bossDeadT = 0; s.deadBoss = null; s.winSequence(); return; }
      }

      // 關卡結束（第 1、2 關）
      if (s.stage < 2 && s.waveIdx >= s.waves.length && s.en.length === 0 && s.clearT === 0) {
        s.clearT = 0.001;
        s.banner('STAGE CLEAR！', '準備前往下一關…');
      }
      if (s.clearT > 0) {
        s.clearT += dt;
        if (s.clearT > 3.2) {
          s.clearT = 0;
          s.eb.forEach(function (b) { b.spr.destroy(); }); s.eb = [];
          s.setupStage(s.stage + 1); s.beginStage();
          return;
        }
      }

      // 畫面震動
      if (s.shake > 0) { s.shake -= dt; s.cameras.main.setScroll((Math.random() - 0.5) * 10 * Math.min(1, s.shake * 4), (Math.random() - 0.5) * 10 * Math.min(1, s.shake * 4)); }
      else s.cameras.main.setScroll(0, 0);

      // HUD
      s.hudScore.setText('分數 ' + pad6(s.score));
      s.hudInfo.setText(THEMES[s.themeKey].name + '・' + th.stages[s.stage].name + '　火力 Lv.' + s.power);
      s.hudLife.setText('❤️'.repeat(Math.max(0, s.lives)));
      s.hudBomb.setText(th.bombName + ' ×' + s.bombs);
      if (s.boss) s.bossBar.width = 460 * Math.max(0, s.boss.hp / s.boss.maxhp);
    }

    updateEnemy(e, dt) {
      const s = this;
      e.t += dt;
      if (e.hitT > 0) { e.hitT -= dt; if (e.hitT <= 0) e.spr.clearTint(); }
      if (e.kind === 'boss') { s.updateBoss(e, dt); e.spr.setPosition(e.x, e.y); return; }
      switch (e.mv) {
        case 'down': e.y += e.spd * dt; break;
        case 'sineL': e.y += e.spd * dt; e.x = e.x0 - Math.sin(e.t * 2.4) * 85; break;
        case 'sineR': e.y += e.spd * dt; e.x = e.x0 + Math.sin(e.t * 2.4) * 85; break;
        case 'diagL': e.y += e.spd * dt; e.x -= 75 * dt; break;
        case 'diagR': e.y += e.spd * dt; e.x += 75 * dt; break;
        case 'hover':
          if (e.state === 0) { e.y += 210 * dt; if (e.y >= e.ty) e.state = 1; }
          else if (e.state === 1) {
            e.x = e.x0 + Math.sin(e.t * 1.4) * 45;
            e.f -= dt;
            if (e.f <= 0) {
              e.f = s.stage === 0 ? 1.9 : 1.5;
              const a = s.aimAngle(e.x, e.y);
              s.ebullet(e.x, e.y + 14, a, 220, false);
              if (s.stage >= 1) { s.ebullet(e.x, e.y + 14, a - 0.28, 210, false); s.ebullet(e.x, e.y + 14, a + 0.28, 210, false); }
            }
            e.life -= dt; if (e.life <= 0) e.state = 2;
          } else { e.y += 230 * dt; }
          break;
        case 'tank':
          e.y += (e.y < 190 ? 90 : e.spd) * dt; e.x = e.x0 + Math.sin(e.t * 0.8) * 40;
          e.f -= dt;
          if (e.f <= 0 && e.y > 40) {
            e.f = 2.1;
            const a = s.aimAngle(e.x, e.y), n = s.stage >= 2 ? 5 : 3;
            for (let i = 0; i < n; i++) s.ebullet(e.x, e.y + 20, a + (i - (n - 1) / 2) * 0.3, 175, false);
          }
          break;
      }
      e.spr.setPosition(e.x, e.y);
      if (e.y > H + 90 || e.x < -100 || e.x > W + 100) { e.spr.destroy(); e.dead = true; s.en = s.en.filter(function (x) { return x !== e; }); }
    }

    updateBoss(e, dt) {
      const s = this;
      if (e.state === 0) { e.y += 110 * dt; if (e.y >= 190) { e.y = 190; e.state = 1; e.t = 0; } return; }
      e.x = W / 2 + Math.sin(e.t * 0.7) * 150; e.y = 190 + Math.sin(e.t * 1.3) * 14;
      const r = e.hp / e.maxhp;
      e.phase = r > 0.66 ? 0 : (r > 0.33 ? 1 : 2);
      e.f1 -= dt; e.f2 -= dt;
      const a = s.aimAngle(e.x, e.y + 40), bx = e.x, by = e.y + 50;
      if (e.phase === 0) {
        if (e.f1 <= 0) { e.f1 = 1.3; for (let i = -1; i <= 1; i++) s.ebullet(bx, by, a + i * 0.24, 230, false); }
        if (e.f2 <= 0) { e.f2 = 3.2; for (let i = 0; i < 14; i++) s.ebullet(bx, by, i * Math.PI * 2 / 14, 150, false); }
      } else if (e.phase === 1) {
        if (e.f1 <= 0) { e.f1 = 0.2; e.ang += 0.42; s.ebullet(bx, by, e.ang, 175, false); s.ebullet(bx, by, e.ang + Math.PI, 175, false); }
        if (e.f2 <= 0) { e.f2 = 1.9; s.ebullet(bx, by, a, 250, true); }
      } else {
        if (e.f1 <= 0) { e.f1 = 0.22; e.ang += 0.5; for (let i = 0; i < 3; i++) s.ebullet(bx, by, e.ang + i * Math.PI * 2 / 3, 185, false); }
        if (e.f2 <= 0) { e.f2 = 1.4; for (let i = -2; i <= 2; i++) s.ebullet(bx, by, a + i * 0.22, 245, false); }
      }
    }

    // —— 測試 / 展示用 ——
    debugGo(themeKey, stage, bossNow) {
      const s = this;
      s.themeKey = themeKey; s.stage = stage || 0;
      s.clearList('title'); s.clearList('hud'); s.clearList('end'); s.clearList('dlg'); s.clearList('bg');
      s.ensureTheme(themeKey);
      s.score = 0; s.lives = 3; s.bombs = 2; s.power = 3; s.god = true; s.invT = 0; s.fireT = 0; s.bombT = 0; s.shake = 0;
      s.cleanupPlay();
      s.player = s.add.image(W / 2, H - 170, 'hero_' + themeKey).setDepth(10);
      s.core = s.add.image(W / 2, H - 170, 'core').setDepth(10.5);
      s.buildHud(); s.setupStage(s.stage); s.beginStage(bossNow);
    }
  }

  window.__game = new Phaser.Game({
    type: Phaser.AUTO,
    width: W,
    height: H,
    parent: 'game',
    backgroundColor: '#0b0f1c',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: GameScene
  });
})();
</script>
</body>
</html>
