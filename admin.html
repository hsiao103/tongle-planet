<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理頁｜同樂小行星</title>
<style>
:root{--bg:#f4f6f2;--fg:#1d2a24;--muted:#66756b;--line:#d5ddd5;--acc:#d9622b;--card:#fff;--red:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#141b17;--fg:#e8efe9;--muted:#9bb0a3;--line:#2c3a32;--card:#1c2621}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--fg);padding:16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button,input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.on{border-color:var(--acc);color:var(--acc);font-weight:600}button.sm{padding:2px 8px;font-size:13px}button.red{color:var(--red);border-color:var(--red)}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--card);font-size:13px;color:var(--muted)}td.t{white-space:nowrap;color:var(--muted);font-size:13px}td.m{word-break:break-all}
.msg{padding:14px;border:1px dashed var(--line);border-radius:10px;margin:12px 0}.hide{display:none}.cnt{color:var(--muted);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.stat{padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.stat b{font-size:20px;display:block}
.chip{display:inline-block;margin:3px;padding:3px 4px 3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card)}.chip button{border:0;background:none;color:var(--red);padding:0 6px}
</style></head><body>
<h1>同樂小行星　管理頁</h1><div class="sub">多人版的對話、登入／進出、禁言與禁用語（僅管理者可用；紀錄保留 90 天）</div>
<div id="gate" class="msg">載入中…</div>
<div id="app" class="hide">
  <div class="bar"><button id="tChat" class="on">對話紀錄</button><button id="tLogin">登入／進出</button><button id="tMute">禁言名單</button><button id="tWord">禁用語</button><span id="who" class="cnt"></span><span style="flex:1"></span><button id="bOut">登出</button></div>
  <div class="stats" id="stats"></div>
  <div id="pLog">
    <div class="bar"><input id="q" placeholder="搜尋暱稱／信箱／內容" size="22"><input id="d1" type="date" title="起"><span>～</span><input id="d2" type="date" title="迄">
      <button id="bGo" class="pri">查詢</button><button id="bCsv">匯出 CSV</button><button id="bDel">刪除勾選（對話）</button><span id="cnt" class="cnt"></span></div>
    <div class="wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  </div>
  <div id="pMute" class="hide">
    <div class="bar"><span class="cnt">禁言後，該帳號不能再送出聊天（對話頁每一列也有「禁言」鈕）。</span></div>
    <div class="wrap"><table><thead><tr><th>時間</th><th>暱稱</th><th>信箱</th><th>備註</th><th></th></tr></thead><tbody id="mb"></tbody></table></div>
  </div>
  <div id="pWord" class="hide">
    <div class="bar"><input id="nw" placeholder="新增禁用語（最多 20 字）" maxlength="20" size="24"><button id="bAdd" class="pri">新增</button><span class="cnt">內建約 600 個詞；這裡新增的所有玩家會在進遊戲時載入，之後每 5 分鐘更新。</span></div>
    <div id="words" class="wrap" style="padding:8px"></div>
  </div>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=id=>document.getElementById(id), cfg=window.TONGLE_SUPABASE; let sb, mode='chat', rows=[], me='';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>new Date(t).toLocaleString('zh-TW',{hour12:false});
function gate(h){$('gate').innerHTML=h;$('gate').classList.remove('hide');$('app').classList.add('hide');}
async function init(){
  if(!cfg||!cfg.url||!cfg.key){gate('找不到 config.js 的 Supabase 設定。');return;}
  sb=supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'pkce'}});
  const {data}=await sb.auth.getSession();
  if(!data.session){gate('請先用管理者的 Google 帳號登入。<p><button class="pri" id="bIn">Google 登入</button></p>');$('bIn').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});return;}
  me=data.session.user.email; $('who').textContent=me; $('gate').classList.add('hide'); $('app').classList.remove('hide'); show('chat');
}
function show(m){
  mode=m; ['Chat','Login','Mute','Word'].forEach(k=>$('t'+k).classList.toggle('on',k.toLowerCase()===m));
  $('pLog').classList.toggle('hide',!(m==='chat'||m==='login')); $('pMute').classList.toggle('hide',m!=='mute'); $('pWord').classList.toggle('hide',m!=='word');
  if(m==='chat'||m==='login') load(); else if(m==='mute') loadMutes(); else loadWords(); stats();
}
async function stats(){
  const t0=new Date(); t0.setHours(0,0,0,0); const iso=t0.toISOString();
  const [a,b,c]=await Promise.all([sb.from('mp_login_log').select('user_id,nick,event,created_at').eq('event','join').gte('created_at',iso).limit(2000), sb.from('mp_chat_log').select('id',{count:'exact',head:true}).gte('created_at',iso), sb.from('mp_mutes').select('user_id',{count:'exact',head:true})]);
  const ids=new Set((a.data||[]).map(r=>r.user_id));
  $('stats').innerHTML=`<div class="stat"><b>${ids.size}</b>今日上線人數</div><div class="stat"><b>${(a.data||[]).length}</b>今日進入次數</div><div class="stat"><b>${b.count==null?'-':b.count}</b>今日對話則數</div><div class="stat"><b>${c.count==null?'-':c.count}</b>禁言中</div>`;
}
async function load(){
  const tab=mode==='chat'?'mp_chat_log':'mp_login_log'; let q=sb.from(tab).select('*').order('created_at',{ascending:false}).limit(1000);
  if($('d1').value) q=q.gte('created_at',new Date($('d1').value+'T00:00:00').toISOString());
  if($('d2').value) q=q.lte('created_at',new Date($('d2').value+'T23:59:59').toISOString());
  const {data,error}=await q; if(error){ $('cnt').textContent='讀取失敗：'+error.message+'（若是權限問題，請確認登入的信箱在 is_tongle_admin() 名單內）'; rows=[]; render(); return; }
  rows=data||[]; render();
}
function render(){
  const k=$('q').value.trim().toLowerCase(), list=rows.filter(r=>!k||[r.nick,r.email,r.msg].some(v=>String(v||'').toLowerCase().includes(k)));
  $('th').innerHTML=mode==='chat'?'<tr><th></th><th>時間</th><th>暱稱</th><th>Google 信箱</th><th>內容</th><th></th></tr>':'<tr><th>時間</th><th>暱稱</th><th>Google 信箱</th><th>事件</th></tr>';
  $('tb').innerHTML=list.map(r=>mode==='chat'?`<tr><td><input type="checkbox" data-id="${r.id}"></td><td class="t">${fmt(r.created_at)}</td><td>${esc(r.nick)}</td><td>${esc(r.email)}</td><td class="m">${esc(r.msg)}</td><td><button class="sm red" data-mu="${r.user_id}" data-em="${esc(r.email)}" data-nk="${esc(r.nick)}">禁言</button></td></tr>`:`<tr><td class="t">${fmt(r.created_at)}</td><td>${esc(r.nick)}</td><td>${esc(r.email)}</td><td>${r.event==='join'?'進入多人版':'離開'}</td></tr>`).join('');
  $('cnt').textContent='共 '+list.length+' 筆'+(rows.length>=1000?'（最多顯示最近 1000 筆，請縮小日期）':''); $('bDel').style.display=mode==='chat'?'':'none'; render.list=list;
  document.querySelectorAll('#tb [data-mu]').forEach(b=>b.onclick=async()=>{ if(!confirm('確定禁言 '+(b.dataset.em||b.dataset.nk)+'？')) return; const note=prompt('備註（選填）','')||''; const {error}=await sb.from('mp_mutes').upsert({user_id:b.dataset.mu,email:b.dataset.em,nick:b.dataset.nk,note}); if(error) alert(error.message); else {alert('已禁言'); stats();} });
}
async function loadMutes(){ const {data,error}=await sb.from('mp_mutes').select('*').order('created_at',{ascending:false}); if(error){$('mb').innerHTML='<tr><td colspan="5">'+esc(error.message)+'</td></tr>';return;}
  $('mb').innerHTML=(data||[]).map(r=>`<tr><td class="t">${fmt(r.created_at)}</td><td>${esc(r.nick)}</td><td>${esc(r.email)}</td><td>${esc(r.note)}</td><td><button class="sm" data-un="${r.user_id}">解除禁言</button></td></tr>`).join('')||'<tr><td colspan="5" class="cnt">目前沒有人被禁言</td></tr>';
  document.querySelectorAll('[data-un]').forEach(b=>b.onclick=async()=>{ const {error}=await sb.from('mp_mutes').delete().eq('user_id',b.dataset.un); if(error) alert(error.message); loadMutes(); stats(); }); }
async function loadWords(){ const {data,error}=await sb.from('mp_badwords').select('*').order('created_at',{ascending:false}).limit(2000); if(error){$('words').textContent=error.message;return;}
  $('words').innerHTML=(data||[]).map(r=>`<span class="chip">${esc(r.word)}<button data-w="${esc(r.word)}" title="刪除">✕</button></span>`).join('')||'<span class="cnt">尚未新增雲端禁用語</span>';
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=async()=>{ const {error}=await sb.from('mp_badwords').delete().eq('word',b.dataset.w); if(error) alert(error.message); loadWords(); }); }
function csv(){const l=render.list||[],h=mode==='chat'?['時間','暱稱','信箱','內容']:['時間','暱稱','信箱','事件'];
  const c=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"', body=l.map(r=>(mode==='chat'?[fmt(r.created_at),r.nick,r.email,r.msg]:[fmt(r.created_at),r.nick,r.email,r.event]).map(c).join(','));
  const b=new Blob(['﻿'+[h.map(c).join(',')].concat(body).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='同樂小行星_'+(mode==='chat'?'對話':'登入')+'紀錄_'+new Date().toISOString().slice(0,10)+'.csv';a.click();}
$('tChat').onclick=()=>show('chat'); $('tLogin').onclick=()=>show('login'); $('tMute').onclick=()=>show('mute'); $('tWord').onclick=()=>show('word');
$('bGo').onclick=load; $('q').oninput=render; $('bCsv').onclick=csv; $('bOut').onclick=async()=>{await sb.auth.signOut();location.reload();};
$('bAdd').onclick=async()=>{const w=$('nw').value.trim(); if(!w) return; const {error}=await sb.from('mp_badwords').upsert({word:w,added_by:me}); if(error) alert(error.message); $('nw').value=''; loadWords();};
$('bDel').onclick=async()=>{const ids=[...document.querySelectorAll('#tb input:checked')].map(i=>+i.dataset.id); if(!ids.length)return alert('請先勾選要刪除的對話');
  if(!confirm('確定永久刪除 '+ids.length+' 則對話？')) return; const {error}=await sb.from('mp_chat_log').delete().in('id',ids); if(error)alert(error.message); load();};
init();
</script></body></html>
