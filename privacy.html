<h1>同樂小行星　隱私權政策</h1><p>更新日期：2026 年 10 月</p>
<p>「同樂小行星」是宜蘭縣員山鄉同樂國小製作的校園 3D 互動遊戲，供學習與參觀使用。</p>
<h2>單人版</h2><p>不需登入，遊戲進度只存在您自己瀏覽器的本機儲存空間，不會上傳。</p>
<h2>多人版（需 Google 登入）</h2><p>登入時我們只取得 Google 帳號的電子郵件與基本資料，用途僅限於辨識登入身分。遊玩期間會即時傳送您的暱稱、位置與動作給同房間的其他玩家，離線後即消失，不做長期保存。</p>
<h2>不會做的事</h2><p>不販售、不出租、不提供資料給第三方，也不用於廣告。</p>
<h2>刪除資料</h2><p>如需刪除登入紀錄，請聯絡同樂國小，我們會於合理時間內處理。</p>
